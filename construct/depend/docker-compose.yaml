services:
  postgres:
    image: postgres:15-alpine
    container_name: go-mall-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: fht3825099
      POSTGRES_DB: mall
      TZ: Asia/Shanghai
    volumes:
      - /Volumes/Fan/docker-data/depend/postgres-data:/var/lib/postgresql/data
      - ../../sql/init_all_tables_postgres.sql:/docker-entrypoint-initdb.d/01-init_all_tables_postgres.sql:ro
    networks:
      - mall
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d mall"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis/redis-stack-server:latest
    container_name: go-mall-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - mall
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  rabbitmq:
    image: rabbitmq:3.8.17-management-alpine
    container_name: go-mall-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - mall
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
      RABBITMQ_DEFAULT_VHOST: /
      TZ: Asia/Shanghai
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  etcd:
    image: quay.io/coreos/etcd:v3.5.0
    container_name: go-mall-etcd
    command:
      - /usr/local/bin/etcd
      - --name=etcd0
      - --data-dir=/etcd-data
      - --advertise-client-urls=http://127.0.0.1:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --initial-advertise-peer-urls=http://127.0.0.1:2380
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-cluster=etcd0=http://127.0.0.1:2380
      - --initial-cluster-state=new
    ports:
      - "2379:2379"
      - "2380:2380"
    volumes:
      - /Volumes/Fan/docker-data/depend/etcd-data:/etcd-data
    networks:
      - mall
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "etcdctl --endpoints=http://127.0.0.1:2379 endpoint health"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
    container_name: go-mall-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - /Volumes/Fan/docker-data/depend/es-data:/usr/share/elasticsearch/data
    networks:
      - mall
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 20

  gorse:
    image: zhenghaoz/gorse-in-one
    container_name: go-mall-gorse
    restart: unless-stopped
    environment:
      GORSE_CACHE_STORE: redis://redis:6379/0
      GORSE_DATA_STORE: postgres://root:fht3825099@postgres/mall?sslmode=disable
    ports:
      - "8086:8086"
      - "8087:8087"
      - "8088:8088"
    command:
      - -c
      - /etc/gorse/config.toml
      - --log-path
      - /var/log/gorse/master.log
      - --cache-path
      - /var/lib/gorse/master
    volumes:
      - ./conf/gorse.config.toml:/etc/gorse/config.toml:ro
      - /Volumes/Fan/docker-data/depend/gorse-data:/var/lib/gorse
      - /Volumes/Fan/docker-data/depend/gorse-logs:/var/log/gorse
    networks:
      - mall
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-lc", "</dev/tcp/127.0.0.1/8088"]
      interval: 15s
      timeout: 5s
      retries: 8

volumes: {}

networks:
  mall:
    driver: bridge
