  # ============ 线上服务器机器指标 (SSH 隧道口，server-status-dashboard) ============
  # gomall-1 (node_exporter on server loopback:9100, tunnel 127.0.0.1:9101)
  - job_name: 'gomall-1'
    scrape_interval: 15s
    static_configs:
      - targets: ['host.docker.internal:9101']
        labels:
          namespace: go-mall
          env: production
          instance: gomall-1

  # gomall-2 (node_exporter on server loopback:9100, tunnel 127.0.0.1:9102)
