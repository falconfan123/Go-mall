# 全局配置
global:
  scrape_interval:     15s # 将搜刮间隔设置为每15秒一次。默认是每1分钟一次。
  evaluation_interval: 15s # 每15秒评估一次规则。默认是每1分钟一次。

# 搜刮配置
# 端口规则：指标端口 = 服务端口 + 1000（gateway 8888→9888，search 8081→9081）
# host 说明：Prometheus 运行在 bridge 网络容器内，宿主机服务统一用 host.docker.internal 抓取；
#           仅 Prometheus 自抓（9090）保留容器内 localhost。
# 标签约定：namespace=go-mall；env=development 与 promtail 侧口径一致（本地开发环境）。
scrape_configs:
  - job_name: 'prometheus' # 监控Prometheus
    # 覆盖全局默认值，每15秒从该作业中刮取一次目标
    scrape_interval: 15s
    static_configs:
      - targets: ['localhost:9090']

  # ============ Go-mall 微服务监控 ============
  # Gateway HTTP 服务 (metrics on 9888)
  - job_name: 'gateway'
    scrape_interval: 10s
    static_configs:
      - targets: ['host.docker.internal:9888']
        labels:
          namespace: go-mall
          service: gateway
          env: development

  # 用户服务 (metrics on 11001)
  - job_name: 'users'
    scrape_interval: 10s
    static_configs:
      - targets: ['host.docker.internal:11001']
        labels:
          namespace: go-mall
          service: users
          env: development

  # 认证服务 (metrics on 11000)
