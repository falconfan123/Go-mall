# Consul Deployment for Go-mall
# 使用官方 Consul Helm chart 的简化版本
---
apiVersion: v1
kind: Service
metadata:
  name: consul-headless
  namespace: go-mall
  labels:
    app: consul
spec:
  # Headless service - 无 cluster IP，用于服务发现
  clusterIP: None
  ports:
    - port: 8500
      targetPort: 8500
      name: http
    - port: 8301
      targetPort: 8301
      name: serf
    - port: 8300
      targetPort: 8300
      name: server
  selector:
    app: consul

---
apiVersion: v1
kind: Service
metadata:
  name: consul
  namespace: go-mall
  labels:
    app: consul
spec:
  type: ClusterIP
  ports:
    - port: 8500
      targetPort: 8500
      name: http
  selector:
    app: consul

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: consul
  namespace: go-mall
  labels:
    app: consul
spec:
  replicas: 1
  selector:
    matchLabels:
      app: consul
  template:
    metadata:
      labels:
        app: consul
    spec:
      containers:
      - name: consul
        image: consul:1.15
        ports:
        - containerPort: 8500
          name: http
        - containerPort: 8300
          name: server
        - containerPort: 8301
          name: serf
        env:
        - name: CONSUL_LOCAL_CONFIG
          value: |
            {
              "server": true,
              "ui_config": {
                "enabled": true
              },
              "ports": {
                "http": 8500,
                "server": 8300,
                "serf_lan": 8301
              },
              "data_dir": "/consul/data",
              "log_level": "info",
              "bootstrap_expect": 1
            }
        command:
        - /bin/sh
        - -ec
        - |
          consul agent -config-file=/dev/stdin
        livenessProbe:
          httpGet:
            path: /v1/status/leader
            port: 8500
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /v1/status/leader
            port: 8500
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi