{{- /* Service ConfigMaps */ -}}
{{- $root := . -}}
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
{{- $rpcKey := default (printf "%s.rpc" $name) $svc.rpcKey }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-config
  namespace: {{ $root.Values.global.namespace | default "default" }}
data:
  {{ $name }}.yaml: |
    Name: {{ $rpcKey }}
    ListenOn: 0.0.0.0:{{ $svc.grpcPort }}
    Mode: dev
    Timeout: 5000

    Etcd:
      Hosts:
        - {{ $root.Values.global.etcd.host }}:{{ $root.Values.global.etcd.port }}
      Key: {{ $rpcKey }}

    Log:
      ServiceName: "{{ $name }}-rpc"
      Mode: "console"
      Encoding: "json"
      Stat: false

    Telemetry:
      Name: {{ $rpcKey }}
      Endpoint: {{ $root.Values.global.jaeger.endpoint | quote }}
      Batcher: zipkin
      Sampler: 1.0

    PostgresConfig:
      datasource: postgres://{{ $root.Values.global.postgres.user }}:{{ $root.Values.global.postgres.password }}@{{ $root.Values.global.postgres.host }}:{{ $root.Values.global.postgres.port }}/{{ $root.Values.global.postgres.database }}?sslmode=disable
      Conntimeout: 5

    RedisConf:
      Host: {{ $root.Values.global.redis.host }}:{{ $root.Values.global.redis.port }}
      Type: node
      Pass: {{ $root.Values.global.redis.password | quote }}
      Tls: false

    PrometheusExt:
      Host: 0.0.0.0
      Port: {{ add 1000 $svc.grpcPort }}
      Path: /metrics

    DevServer:
      Enabled: true
      Host: 0.0.0.0
      Port: {{ add 1000 $svc.grpcPort }}
      EnablePprof: false

    {{- if eq $name "auths" }}
    SessionRedis:
      Host: {{ $root.Values.global.redis.host }}:{{ $root.Values.global.redis.port }}
      Type: node
      Pass: {{ $root.Values.global.redis.password | quote }}
    {{- end }}

    {{- if eq $name "users" }}
    Salt: "J1j1zH4zH4"
    AuthConfig:
      AccessSecret: "uKq5xR8vW2zN9mP4sL7jH6yG3bF1dC0"
      AccessExpire: 86400
    Cache:
      - Host: {{ $root.Values.global.redis.host }}:{{ $root.Values.global.redis.port }}
        Pass: {{ $root.Values.global.redis.password | quote }}
        Type: node
    GorseConfig:
      GorseAddr: {{ $root.Values.global.gorse.host | quote }}
      GorseApikey: {{ $root.Values.global.gorse.apikey | quote }}
    {{- end }}

    {{- if or (eq $name "activity") (eq $name "system") }}
    Activity:
      TokenExpire: 60
      AdvanceSeconds: 5
    {{- end }}

    {{- if eq $name "product" }}
    InventoryRpc:
      Etcd:
        Hosts:
          - {{ $root.Values.global.etcd.host }}:{{ $root.Values.global.etcd.port }}
        Key: {{ index $root.Values.services "inventory" "rpcKey" }}
      NonBlock: true
      Timeout: 3000
    ElasticSearch:
      Addr: {{ $root.Values.global.elasticsearch.host | quote }}
      IndexName: products
    GorseConfig:
      GorseAddr: {{ $root.Values.global.gorse.host | quote }}
      GorseApikey: {{ $root.Values.global.gorse.apikey | quote }}
    QiNiu:
      AccessKey: ""
      SecretKey: ""
      Bucket: ""
      Domain: ""
    Minio:
      Endpoint: minio.go-mall.svc.cluster.local:9000
      AccessKey: minioadmin
      SecretKey: minioadmin
      Bucket: go-mall
      UseSSL: false
    {{- end }}

    {{- if eq $name "coupons" }}
    ProductRpc:
      Etcd:
        Hosts:
          - {{ $root.Values.global.etcd.host }}:{{ $root.Values.global.etcd.port }}
        Key: {{ index $root.Values.services "product" "rpcKey" }}
      NonBlock: true
      Timeout: 5000
    {{- end }}

    {{- if eq $name "admin" }}
    ProductRpc:
      Etcd:
        Hosts:
          - {{ $root.Values.global.etcd.host }}:{{ $root.Values.global.etcd.port }}
        Key: {{ index $root.Values.services "product" "rpcKey" }}
      NonBlock: true
      Timeout: 5000
    InventoryRpc:
      Etcd:
        Hosts:
          - {{ $root.Values.global.etcd.host }}:{{ $root.Values.global.etcd.port }}
        Key: {{ index $root.Values.services "inventory" "rpcKey" }}
      NonBlock: true
      Timeout: 3000
    {{- end }}

    {{- if eq $name "order" }}
    CheckoutRpc:
      Etcd:
        Hosts:
          - {{ $root.Values.global.etcd.host }}:{{ $root.Values.global.etcd.port }}
        Key: {{ index $root.Values.services "checkout" "rpcKey" }}
      NonBlock: true
      Timeout: 16000
    CouponRpc:
      Etcd:
        Hosts:
          - {{ $root.Values.global.etcd.host }}:{{ $root.Values.global.etcd.port }}
        Key: {{ index $root.Values.services "coupons" "rpcKey" }}
      NonBlock: true
      Timeout: 4000
    UserRpc:
      Etcd:
        Hosts:
          - {{ $root.Values.global.etcd.host }}:{{ $root.Values.global.etcd.port }}
        Key: {{ index $root.Values.services "users" "rpcKey" }}
      NonBlock: true
      Timeout: 3000
    InventoryRpc:
      Etcd:
        Hosts:
          - {{ $root.Values.global.etcd.host }}:{{ $root.Values.global.etcd.port }}
        Key: {{ index $root.Values.services "inventory" "rpcKey" }}
      NonBlock: true
      Timeout: 3000
    RabbitMQConfig:
      Host: {{ $root.Values.global.rabbitmq.host | quote }}
      Port: {{ $root.Values.global.rabbitmq.port }}
      User: {{ $root.Values.global.rabbitmq.user | quote }}
      Pass: {{ $root.Values.global.rabbitmq.password | quote }}
      VHost: {{ $root.Values.global.rabbitmq.vhost | quote }}
    {{- end }}

    {{- if eq $name "checkout" }}
    InventoryRpc:
      Etcd:
        Hosts:
          - {{ $root.Values.global.etcd.host }}:{{ $root.Values.global.etcd.port }}
        Key: {{ index $root.Values.services "inventory" "rpcKey" }}
      NonBlock: true
      Timeout: 3000
    ProductRpc:
      Etcd:
        Hosts:
          - {{ $root.Values.global.etcd.host }}:{{ $root.Values.global.etcd.port }}
        Key: {{ index $root.Values.services "product" "rpcKey" }}
      NonBlock: true
      Timeout: 5000
    CouponsRpc:
      Etcd:
        Hosts:
          - {{ $root.Values.global.etcd.host }}:{{ $root.Values.global.etcd.port }}
        Key: {{ index $root.Values.services "coupons" "rpcKey" }}
      NonBlock: true
      Timeout: 5000
    RabbitMQConfig:
      Host: {{ $root.Values.global.rabbitmq.host | quote }}
      Port: {{ $root.Values.global.rabbitmq.port }}
      User: {{ $root.Values.global.rabbitmq.user | quote }}
      Pass: {{ $root.Values.global.rabbitmq.password | quote }}
      VHost: {{ $root.Values.global.rabbitmq.vhost | quote }}
    {{- end }}

    {{- if eq $name "payment" }}
    OrderRpc:
      Etcd:
        Hosts:
          - {{ $root.Values.global.etcd.host }}:{{ $root.Values.global.etcd.port }}
        Key: {{ index $root.Values.services "order" "rpcKey" }}
      NonBlock: true
      Timeout: 5000
    RabbitMQConfig:
      Host: {{ $root.Values.global.rabbitmq.host | quote }}
      Port: {{ $root.Values.global.rabbitmq.port }}
      User: {{ $root.Values.global.rabbitmq.user | quote }}
      Pass: {{ $root.Values.global.rabbitmq.password | quote }}
      VHost: {{ $root.Values.global.rabbitmq.vhost | quote }}
    Alipay:
      AppId: ""
      AlipayPublicKey: ""
      PrivateKey: ""
      NotifyURL: ""
      NotifyPath: ""
      NotifyPort: 0
      ReturnURL: ""
    Stripe:
      APIKey: ""
      SuccessURL: ""
      CancelURL: ""
      WebhookSecret: ""
      WebhookPort: 0
    {{- end }}

    {{- if eq $name "audit" }}
    RabbitMQ:
      Host: {{ $root.Values.global.rabbitmq.host | quote }}
      Port: {{ $root.Values.global.rabbitmq.port }}
      User: {{ $root.Values.global.rabbitmq.user | quote }}
      Pass: {{ $root.Values.global.rabbitmq.password | quote }}
      VHost: {{ $root.Values.global.rabbitmq.vhost | quote }}
    ElasticSearch:
      Addr: {{ $root.Values.global.elasticsearch.host | quote }}
      IndexName: audit_logs
    {{- end }}

    {{- if eq $name "search" }}
    ProductRpc:
      Etcd:
        Hosts:
          - {{ $root.Values.global.etcd.host }}:{{ $root.Values.global.etcd.port }}
        Key: {{ index $root.Values.services "product" "rpcKey" }}
      NonBlock: true
      Timeout: 5000
    {{- end }}
{{- end }}
{{- end }}

{{- /* Gateway ConfigMap */ -}}
{{- if .Values.gateway.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: {{ .Values.global.namespace | default "default" }}
data:
  gateway.yaml: |
    Name: gateway
    Host: 0.0.0.0
    Port: {{ .Values.gateway.port }}

    Log:
      Mode: "console"
      Encoding: "json"
      Stat: false

    Auth:
      AccessSecret: "u666"
      AccessExpire: 86400

    Upstreams:
      - Grpc:
          Etcd:
            Hosts:
              - {{ .Values.global.etcd.host }}:{{ .Values.global.etcd.port }}
            Key: {{ index .Values.services "users" "rpcKey" }}
          NonBlock: true
        Mappings:
          - Method: post
            Path: /douyin/user/login
            RpcPath: users.Users/Login
          - Method: post
            Path: /douyin/user/register
            RpcPath: users.Users/Register
          - Method: post
            Path: /api/v1/users/login
            RpcPath: users.Users/Login
          - Method: post
            Path: /api/v1/users/register
            RpcPath: users.Users/Register
          - Method: get
            Path: /api/v1/users/me
            RpcPath: users.Users/GetUser
          - Method: post
            Path: /api/v1/users/addresses
            RpcPath: users.Users/AddAddress
          - Method: get
            Path: /api/v1/users/address
            RpcPath: users.Users/GetAddress

      - Grpc:
          Etcd:
            Hosts:
              - {{ .Values.global.etcd.host }}:{{ .Values.global.etcd.port }}
            Key: {{ index .Values.services "product" "rpcKey" }}
          NonBlock: true
        Mappings:
          - Method: get
            Path: /douyin/product/list
            RpcPath: product.ProductCatalogService/ListProducts
          - Method: get
            Path: /douyin/product/detail
            RpcPath: product.ProductCatalogService/GetProduct
          - Method: get
            Path: /api/v1/products
            RpcPath: product.ProductCatalogService/ListProducts
          - Method: get
            Path: /api/v1/products/detail
            RpcPath: product.ProductCatalogService/GetProduct
          - Method: post
            Path: /douyin/product/upload
            RpcPath: product.ProductCatalogService/GetUploadURL

      - Grpc:
          Etcd:
            Hosts:
              - {{ .Values.global.etcd.host }}:{{ .Values.global.etcd.port }}
            Key: {{ index .Values.services "carts" "rpcKey" }}
          NonBlock: true
        Mappings:
          - Method: post
            Path: /douyin/cart/add
            RpcPath: carts.Cart/CreateCartItem
          - Method: get
            Path: /douyin/cart/list
            RpcPath: carts.Cart/CartItemList
          - Method: post
            Path: /douyin/cart/delete
            RpcPath: carts.Cart/DeleteCartItem
          - Method: post
            Path: /douyin/cart/sub
            RpcPath: carts.Cart/SubCartItem
          - Method: get
            Path: /api/v1/cart/items
            RpcPath: carts.Cart/CartItemList
          - Method: post
            Path: /api/v1/cart/items
            RpcPath: carts.Cart/CreateCartItem
          - Method: post
            Path: /api/v1/cart/items/delete
            RpcPath: carts.Cart/DeleteCartItem
          - Method: post
            Path: /api/v1/cart/items/sub
            RpcPath: carts.Cart/SubCartItem

      - Grpc:
          Etcd:
            Hosts:
              - {{ .Values.global.etcd.host }}:{{ .Values.global.etcd.port }}
            Key: {{ index .Values.services "order" "rpcKey" }}
          NonBlock: true
        Mappings:
          - Method: post
            Path: /douyin/order/create
            RpcPath: order.OrderService/CreateOrder
          - Method: get
            Path: /douyin/order/list
            RpcPath: order.OrderService/ListOrders
          - Method: post
            Path: /api/v1/orders
            RpcPath: order.OrderService/CreateOrder
          - Method: get
            Path: /api/v1/orders
            RpcPath: order.OrderService/ListOrders
          - Method: get
            Path: /api/v1/orders/detail
            RpcPath: order.OrderService/GetOrder
          - Method: post
            Path: /api/v1/orders/cancel
            RpcPath: order.OrderService/CancelOrder
          - Method: post
            Path: /api/v1/orders/seckill
            RpcPath: order.OrderService/Seckill

      - Grpc:
          Etcd:
            Hosts:
              - {{ .Values.global.etcd.host }}:{{ .Values.global.etcd.port }}
            Key: {{ index .Values.services "checkout" "rpcKey" }}
          NonBlock: true
        Mappings:
          - Method: post
            Path: /douyin/checkout/prepare
            RpcPath: checkout.CheckoutService/PrepareCheckout
          - Method: post
            Path: /api/v1/checkout/prepare
            RpcPath: checkout.CheckoutService/PrepareCheckout
          - Method: post
            Path: /api/v1/checkout/release
            RpcPath: checkout.CheckoutService/ReleaseCheckout
          - Method: get
            Path: /api/v1/checkout/list
            RpcPath: checkout.CheckoutService/GetCheckoutList
          - Method: get
            Path: /api/v1/checkout/detail
            RpcPath: checkout.CheckoutService/GetCheckoutDetail

      - Grpc:
          Etcd:
            Hosts:
              - {{ .Values.global.etcd.host }}:{{ .Values.global.etcd.port }}
            Key: {{ index .Values.services "payment" "rpcKey" }}
          NonBlock: true
        Mappings:
          - Method: post
            Path: /douyin/payment/create
            RpcPath: payment.Payment/CreatePayment
          - Method: post
            Path: /api/v1/payments
            RpcPath: payment.Payment/CreatePayment

      - Grpc:
          Etcd:
            Hosts:
              - {{ .Values.global.etcd.host }}:{{ .Values.global.etcd.port }}
            Key: {{ index .Values.services "inventory" "rpcKey" }}
          NonBlock: true
        Mappings:
          - Method: get
            Path: /api/v1/inventory/detail
            RpcPath: inventory.Inventory/GetInventory
          - Method: post
            Path: /api/v1/inventory/update
            RpcPath: inventory.Inventory/UpdateInventory
          - Method: post
            Path: /api/v1/inventory/decrease
            RpcPath: inventory.Inventory/DecreaseInventory
          - Method: post
            Path: /api/v1/inventory/return
            RpcPath: inventory.Inventory/ReturnInventory

      - Grpc:
          Etcd:
            Hosts:
              - {{ .Values.global.etcd.host }}:{{ .Values.global.etcd.port }}
            Key: {{ index .Values.services "system" "rpcKey" }}
          NonBlock: true
        Mappings:
          - Method: get
            Path: /api/v1/system/time
            RpcPath: system.System/Time

      - Grpc:
          Etcd:
            Hosts:
              - {{ .Values.global.etcd.host }}:{{ .Values.global.etcd.port }}
            Key: {{ index .Values.services "activity" "rpcKey" }}
          NonBlock: true
        Mappings:
          - Method: get
            Path: /api/v1/activity/token
            RpcPath: activity.Activity/Token
          - Method: get
            Path: /api/v1/activity/status
            RpcPath: activity.Activity/CheckSeckillStatus

      - Grpc:
          Etcd:
            Hosts:
              - {{ .Values.global.etcd.host }}:{{ .Values.global.etcd.port }}
            Key: {{ index .Values.services "auths" "rpcKey" }}
          NonBlock: true
        Mappings:
          - Method: post
            Path: /api/v1/auth/token
            RpcPath: auths.Auths/GenerateToken
          - Method: post
            Path: /api/v1/auth/validate
            RpcPath: auths.Auths/ValidateToken
          - Method: post
            Path: /api/v1/auth/renewal
            RpcPath: auths.Auths/RenewToken
          - Method: post
            Path: /api/v1/auth/logout
            RpcPath: auths.Auths/Logout

      - Grpc:
          Etcd:
            Hosts:
              - {{ .Values.global.etcd.host }}:{{ .Values.global.etcd.port }}
            Key: {{ index .Values.services "coupons" "rpcKey" }}
          NonBlock: true
        Mappings:
          - Method: get
            Path: /douyin/coupon/list
            RpcPath: coupons.Coupons/ListCoupons

      - Grpc:
          Etcd:
            Hosts:
              - {{ .Values.global.etcd.host }}:{{ .Values.global.etcd.port }}
            Key: {{ index .Values.services "admin" "rpcKey" }}
          NonBlock: true
        Mappings:
          - Method: get
            Path: /api/v1/admin/products
            RpcPath: admin.AdminProductService/ListProducts
          - Method: post
            Path: /api/v1/admin/products
            RpcPath: admin.AdminProductService/CreateProduct
          - Method: put
            Path: /api/v1/admin/products/:id
            RpcPath: admin.AdminProductService/UpdateProduct
          - Method: delete
            Path: /api/v1/admin/products/:id
            RpcPath: admin.AdminProductService/DeleteProduct
{{- end }}
