{{- /* 网关 Deployment */ -}}
{{- if .Values.gateway.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Values.global.namespace | default "default" }}
  labels:
    app: gateway
    tier: frontend
spec:
  replicas: {{ .Values.gateway.replicas | default 1 }}
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
        tier: frontend
    spec:
      containers:
      - name: gateway
        image: {{ if .Values.global.imageRegistry }}{{ .Values.global.imageRegistry }}/{{ end }}{{ .Values.gateway.image }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        command: ["/app/gateway"]
        args: ["-f", "/app/etc/gateway.yaml"]

        ports:
        - containerPort: {{ .Values.gateway.port }}
          name: http

        {{- if .Values.gateway.resources }}
        resources:
          {{- if .Values.gateway.resources.limits }}
          limits:
            cpu: {{ .Values.gateway.resources.limits.cpu }}
            memory: {{ .Values.gateway.resources.limits.memory }}
          {{- end }}
          {{- if .Values.gateway.resources.requests }}
          requests:
            cpu: {{ .Values.gateway.resources.requests.cpu }}
            memory: {{ .Values.gateway.resources.requests.memory }}
          {{- end }}
        {{- end }}

        livenessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10

        readinessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5

        volumeMounts:
        - name: config
          mountPath: /app/etc
          readOnly: true

      volumes:
      - name: config
        configMap:
          name: gateway-config

---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: {{ .Values.global.namespace | default "default" }}
spec:
  type: {{ .Values.gateway.serviceType | default "ClusterIP" }}
  {{- if eq .Values.gateway.serviceType "NodePort" }}
  ports:
  - port: {{ .Values.gateway.port }}
    targetPort: {{ .Values.gateway.port }}
    nodePort: {{ .Values.gateway.nodePort }}
    protocol: TCP
    name: http
  {{- else }}
  ports:
  - port: {{ .Values.gateway.port }}
    targetPort: {{ .Values.gateway.port }}
    protocol: TCP
    name: http
  {{- end }}
  selector:
    app: gateway

{{- end }}
