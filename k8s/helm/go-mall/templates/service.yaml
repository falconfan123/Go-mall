{{- /* 生成所有服务的 Service */ -}}
{{- $root := . -}}

{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-rpc
  namespace: {{ $root.Values.global.namespace | default "default" }}
  labels:
    app: {{ $name }}
    tier: backend
spec:
  type: ClusterIP
  ports:
  - port: {{ $svc.grpcPort }}
    targetPort: {{ $svc.grpcPort }}
    protocol: TCP
    name: grpc
  - port: {{ $svc.httpPort }}
    targetPort: {{ $svc.httpPort }}
    protocol: TCP
    name: http
  selector:
    app: {{ $name }}

---
# Headless Service for stable network identity
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-rpc-headless
  namespace: {{ $root.Values.global.namespace | default "default" }}
  labels:
    app: {{ $name }}
spec:
  clusterIP: None
  ports:
  - port: {{ $svc.grpcPort }}
    targetPort: {{ $svc.grpcPort }}
    protocol: TCP
    name: grpc
  selector:
    app: {{ $name }}

{{- end }}
{{- end }}