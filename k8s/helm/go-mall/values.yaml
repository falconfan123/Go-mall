# Go-mall Helm Chart Values
# 12 个微服务的统一配置

global:
  namespace: go-mall
  imageRegistry: ""
  imagePullPolicy: Never

  # 共享配置 - 使用 K8s 内部服务
  etcd:
    host: etcd.go-mall.svc.cluster.local
    port: 2379
  redis:
    host: redis.go-mall.svc.cluster.local
    port: 6379
    password: ""
  postgres:
    host: postgres.go-mall.svc.cluster.local
    port: 5432
    user: root
    password: fht3825099
    database: mall
  rabbitmq:
    host: rabbitmq.go-mall.svc.cluster.local
    port: 5672
    user: admin
    password: admin
    vhost: /
  elasticsearch:
    host: http://elasticsearch.go-mall.svc.cluster.local:9200
  gorse:
    host: http://gorse.go-mall.svc.cluster.local:8088
    apikey: ""
  jaeger:
    endpoint: http://jaeger-collector.go-mall.svc.cluster.local:14268/api/traces

# 12 个微服务配置
services:
  auths:
    enabled: true
    image: go-mall/auths:latest
    rpcKey: auths.rpc
    port: 10000
    grpcPort: 10000
    httpPort: 8080
    replicas: 1
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi

  users:
    enabled: true
    image: go-mall/users:latest
    rpcKey: users.rpc
    port: 10001
