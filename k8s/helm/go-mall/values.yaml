# 网关配置
gateway:
  enabled: true
  image: go-mall/gateway:latest
  port: 8888
  replicas: 1
  serviceType: NodePort
  nodePort: 30088
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

# Ingress 配置
ingress:
  enabled: true
  className: nginx
  host: api.go-mall.local
  tls:
    enabled: false
    secretName: go-mall-tls

# 健康检查配置
healthCheck:
  liveness:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
