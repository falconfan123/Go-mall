# Go-mall Helm Chart Values
# 12 个微服务的统一配置

global:
  namespace: go-mall
  imageRegistry: docker.io
  imagePullPolicy: IfNotPresent

  # 共享配置
  consul:
    host: consul-headless.consul.svc.cluster.local
    port: 8500
  redis:
    host: redis.redis.svc.cluster.local
    port: 6379
  postgres:
    host: postgres.postgres.svc.cluster.local
    port: 5432
    user: root
    password: fht3825099
    database: mall
  jaeger:
    endpoint: http://jaeger-collector.observability.svc.cluster.local:14268/api/traces

# 12 个微服务配置
services:
  auths:
    enabled: true
    image: minikube/authsatest:latest
    port: 10000
    grpcPort: 10000
    httpPort: 8080
    replicas: 1
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi

  users:
