# Nginx API Gateway Configuration with gRPC support
# Go-mall 微服务网关

events {
    worker_connections 1024;
}

stream {
    # gRPC 代理配置
    upstream users {
        server users-rpc.go-mall.svc.cluster.local:10001;
    }

    upstream product {
        server product-rpc.go-mall.svc.cluster.local:10002;
    }

    upstream carts {
        server carts-rpc.go-mall.svc.cluster.local:10003;
    }

    upstream order {
        server order-rpc.go-mall.svc.cluster.local:10004;
    }

    upstream checkout {
        server checkout-rpc.go-mall.svc.cluster.local:10005;
    }

    upstream payment {
        server payment-rpc.go-mall.svc.cluster.local:10006;
    }

    upstream inventory {
        server inventory-rpc.go-mall.svc.cluster.local:10007;
    }

    upstream auths {
        server auths-rpc.go-mall.svc.cluster.local:10000;
    }

    upstream system {
        server system-rpc.go-mall.svc.cluster.local:10010;
    }

    upstream activity {
        server activity-rpc.go-mall.svc.cluster.local:10011;
    }

    upstream admin {
        server admin-rpc.go-mall.svc.cluster.local:10012;
    }

    # gRPC 代理 - users
    server {
        listen 10001;
        proxy_pass users;
    }

    # gRPC 代理 - product
    server {
        listen 10002;
        proxy_pass product;
    }

    # gRPC 代理 - carts
    server {
        listen 10003;
        proxy_pass carts;
    }

    # gRPC 代理 - order
    server {
        listen 10004;
        proxy_pass order;
    }

    # gRPC 代理 - checkout
    server {
        listen 10005;
        proxy_pass checkout;
    }

    # gRPC 代理 - payment
    server {
        listen 10006;
        proxy_pass payment;
    }

    # gRPC 代理 - inventory
    server {
        listen 10007;
        proxy_pass inventory;
    }

    # gRPC 代理 - auths
    server {
        listen 10000;
        proxy_pass auths;
    }

    # gRPC 代理 - system
    server {
        listen 10010;
        proxy_pass system;
    }

    # gRPC 代理 - activity
    server {
        listen 10011;
        proxy_pass activity;
    }

    # gRPC 代理 - admin
    server {
        listen 10012;
        proxy_pass admin;
    }
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout 65;
    gzip on;

    server {
        listen 8888;
        server_name _;

        # CORS headers
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, Short-Token, Long-Token, user_id, x-requested-with' always;

        # Health check
        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        return 404 '{"error": "use gRPC to connect RPC services"}';
        add_header Content-Type application/json;
    }
}