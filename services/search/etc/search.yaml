Name: search
ListenOn: 0.0.0.0:8081
Mode: dev
Log:
  ServiceName: search
  Mode: console

Etcd:
  Hosts:
    - 127.0.0.1:2379
  Key: search.rpc

PostgresConfig:
  DataSource: "postgres://root:fht3825099@localhost:5432/mall?sslmode=disable"
  Conntimeout: 5

RedisConf:
  Host: 127.0.0.1
  Type: node

ElasticSearch:
  Addr: http://127.0.0.1:9200
  IndexName: products

ProductRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: products.rpc
  NonBlock: true
  Timeout: 5000

PrometheusExt:
  Host: 0.0.0.0
  Port: 9113
  Path: /metrics
