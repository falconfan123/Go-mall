Name: inventory.rpc
ListenOn: 0.0.0.0:10007
Mode: dev

# 服务发现
Etcd:
  Hosts:
    - localhost:2379
  Key: inventory.rpc

Telemetry:
  Name: inventory.rpc
  Endpoint: http://localhost:9411/api/v2/spans
  Batcher: zipkin
  Sampler: 1.0

Log:
  ServiceName: inventory-rpc
  Mode: console
  Encoding: json
  Stat: false

PostgresConfig:
  datasource: postgres://root:fht3825099@localhost:5432/mall?sslmode=disable
  Conntimeout: 5

RedisConf:
  Host: localhost:6379
  Pass: ""
  Tls: false

DevServer:
  Enabled: true
  Host: 0.0.0.0
  Port: 11007
  EnablePprof: false
