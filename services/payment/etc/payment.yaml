Name: payment.rpc
ListenOn: 0.0.0.0:10006
Mode: dev
Timeout: 10000

# 服务发现
Etcd:
  Hosts:
    - localhost:2379
  Key: payment.rpc

Telemetry:
  Name: payment.rpc
  Endpoint: http://localhost:9411/api/v2/spans
  Batcher: zipkin
  Sampler: 1.0

Log:
  ServiceName: payment-rpc
  Mode: console
  Encoding: json
  Stat: false

PostgresConfig:
  datasource: postgres://root:fht3825099@localhost:5432/mall?sslmode=disable
  conntimeout: 5

RedisConf:
  Host: localhost:6379
  Pass: ""
  Tls: false

Stripe:
  APIKey: "sk_test_51QItbp03vhJsKPuLhafsMvAgW6cUattQas8EWX72d9vkZO13kSYs9TlpIU00g0pF3QjQR4zuwd0VQ0fRaU458nA300c9zfDYop"
  # SuccessURL/CancelURL can also be set via env vars: STRIPE_SUCCESS_URL, STRIPE_CANCEL_URL
  # For local dev: http://127.0.0.1:3000/payment/success
  # For production: https://your-domain.com/payment/success
  # IMPORTANT: Non-local environments must use a publicly accessible domain, NOT 127.0.0.1 or localhost
  SuccessURL: "http://127.0.0.1:3000/payment/success"
  CancelURL: "http://127.0.0.1:3000/payment/cancel"
  WebhookSecret: "whsec_a8b03f35ed1100de63b66e47eec1040a422026b264b92f7dd28681fb98591e07"
  WebhookPort: 11112
  RequestTimeoutMs: 8000
  MaxNetworkRetries: 2

OrderRpc:
  Etcd:
    Hosts:
      - localhost:2379
    Key: order.rpc
  NonBlock: true
  Timeout: 25000

RabbitMQConfig:
  Host: "localhost"
  Port: 5672
  User: "guest"
  Pass: "guest"
  VHost: "/"

Consumer:
  RetryLimit: 3
  BackoffBaseMs: 1000
  ShutdownTimeoutMs: 10000
  IdempotencyTtlSeconds: 3600
  SuccessTtlSeconds: 86400

# DTM saga 发起方配置（Server 为 dtm gRPC 直连；BusiHost 为 dtm 容器回调分支服务的 host 前缀）
Dtm:
  Server: localhost:36790
  HttpAddr: localhost:36789
  BusiHost: host.docker.internal
  OrderPort: 10004
  InventoryPort: 10007
  CouponsPort: 10009

# 结算兜底三层（outbox relay / 对账扫描 / Stripe 对账）
Fallback:
  RelayTickMs: 10000
  ScannerTickMs: 300000
  Scan1ThresholdMinutes: 10
  Scan2ThresholdMinutes: 35
  RelayMaxAttempts: 5
  TombstoneMaxRetry: 3
  ReconHour: 2
  ReconDisabled: false

DevServer:
  Enabled: true
  Host: 0.0.0.0
  Port: 11006
  EnablePprof: false
