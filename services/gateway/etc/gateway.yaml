# Gateway 配置 - 静态 Target（当前可用）
Name: gateway
Host: 0.0.0.0
Port: 8888

Log:
  Mode: 'console'
  Encoding: 'json'
  Stat: true

Auth:
  AccessSecret: "u666"
  AccessExpire: 86400

Upstreams:
  # Users 服务
  - Grpc:
      NonBlock: true
      Target: users.go-mall.svc.cluster.local:10001
    Mappings:
      - Method: post
        Path: /douyin/user/login
        RpcPath: users.Users/Login
      - Method: post
        Path: /douyin/user/register
        RpcPath: users.Users/Register

  # Product 服务
  - Grpc:
      NonBlock: true
      Target: product.go-mall.svc.cluster.local:10002
    Mappings:
      - Method: get
        Path: /douyin/product/list
        RpcPath: product.ProductCatalogService/ListProducts

  # System 服务
  - Grpc:
      NonBlock: true
      Target: system.go-mall.svc.cluster.local:10010
    Mappings:
      - Method: get
        Path: /api/v1/system/time
        RpcPath: system.System/Time