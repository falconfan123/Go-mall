Name: gateway
Host: 0.0.0.0
Port: 8888
Timeout: 12000

Log:
  Mode: "console"
  Encoding: "json"
  Stat: false

Auth:
  AccessSecret: "u666"
  AccessExpire: 86400

Upstreams:
  - Grpc:
      Etcd:
        Hosts:
          - localhost:2379
        Key: users.rpc
      NonBlock: true
    Mappings:
      - Method: post
        Path: /douyin/user/login
        RpcPath: users.Users/Login
      - Method: post
        Path: /douyin/user/register
        RpcPath: users.Users/Register
      - Method: post
        Path: /api/v1/users/login
        RpcPath: users.Users/Login
      - Method: post
        Path: /api/v1/users/register
        RpcPath: users.Users/Register
      - Method: post
        Path: /api/v1/users/logout
        RpcPath: users.Users/Logout
      - Method: get
        Path: /api/v1/users/me
        RpcPath: users.Users/GetUser
      - Method: post
        Path: /api/v1/users/addresses
        RpcPath: users.Users/AddAddress
      - Method: get
        Path: /api/v1/users/address
        RpcPath: users.Users/GetAddress

  - Grpc:
      Etcd:
        Hosts:
          - localhost:2379
        Key: products.rpc
      NonBlock: true
    Mappings:
      - Method: get
        Path: /douyin/product/list
        RpcPath: product.ProductCatalogService/ListProducts
      - Method: get
        Path: /douyin/product/detail
        RpcPath: product.ProductCatalogService/GetProduct
      - Method: get
        Path: /api/v1/products
        RpcPath: product.ProductCatalogService/ListProducts
      - Method: get
        Path: /api/v1/products/detail
        RpcPath: product.ProductCatalogService/GetProduct

  - Grpc:
      Etcd:
        Hosts:
          - localhost:2379
        Key: carts.rpc
      NonBlock: true
    Mappings:
      - Method: get
        Path: /douyin/cart/list
        RpcPath: carts.Cart/CartItemList
      - Method: post
        Path: /douyin/cart/add
        RpcPath: carts.Cart/CreateCartItem
      - Method: post
        Path: /douyin/cart/sub
        RpcPath: carts.Cart/SubCartItem
      - Method: post
        Path: /douyin/cart/delete
        RpcPath: carts.Cart/DeleteCartItem
      - Method: get
        Path: /api/v1/cart/items
        RpcPath: carts.Cart/CartItemList
      - Method: post
        Path: /api/v1/cart/items
        RpcPath: carts.Cart/CreateCartItem
      - Method: post
        Path: /api/v1/cart/items/sub
        RpcPath: carts.Cart/SubCartItem
      - Method: post
        Path: /api/v1/cart/items/delete
        RpcPath: carts.Cart/DeleteCartItem

  - Grpc:
      Etcd:
        Hosts:
          - localhost:2379
        Key: order.rpc
      NonBlock: true
    Mappings:
      - Method: post
        Path: /douyin/order/create
        RpcPath: order.OrderService/CreateOrder
      - Method: get
        Path: /douyin/order/list
        RpcPath: order.OrderService/ListOrders
      - Method: post
        Path: /api/v1/orders
        RpcPath: order.OrderService/CreateOrder
      - Method: get
        Path: /api/v1/orders
        RpcPath: order.OrderService/ListOrders
      - Method: get
        Path: /api/v1/orders/detail
        RpcPath: order.OrderService/GetOrder
      - Method: post
        Path: /api/v1/orders/cancel
        RpcPath: order.OrderService/CancelOrder
      - Method: post
        Path: /api/v1/orders/seckill
        RpcPath: order.OrderService/Seckill

  - Grpc:
      Etcd:
        Hosts:
          - localhost:2379
        Key: checkout.rpc
      NonBlock: true
    Mappings:
      - Method: post
        Path: /douyin/checkout/prepare
        RpcPath: checkout.CheckoutService/PrepareCheckout
      - Method: post
        Path: /api/v1/checkout/prepare
        RpcPath: checkout.CheckoutService/PrepareCheckout

  - Grpc:
      Etcd:
        Hosts:
          - localhost:2379
        Key: payment.rpc
      NonBlock: true
      Timeout: 10000
    Mappings:
      - Method: post
        Path: /douyin/payment/create
        RpcPath: payment.Payment/CreatePayment
      - Method: get
        Path: /api/v1/payments
        RpcPath: payment.Payment/ListPayments
      - Method: get
        Path: /api/v1/payments/status
        RpcPath: payment.Payment/GetPaymentStatus
      - Method: post
        Path: /api/v1/payments
        RpcPath: payment.Payment/CreatePayment

  - Grpc:
      Etcd:
        Hosts:
          - localhost:2379
        Key: activity.rpc
      NonBlock: true
    Mappings:
      - Method: get
        Path: /api/v1/activity/token
        RpcPath: activity.Activity/Token
      - Method: get
        Path: /api/v1/activity/status
        RpcPath: activity.Activity/CheckSeckillStatus

  - Grpc:
      Etcd:
        Hosts:
          - localhost:2379
        Key: system.rpc
      NonBlock: true
    Mappings:
      - Method: get
        Path: /api/v1/system/time
        RpcPath: system.System/Time

  - Name: auths
    Grpc:
      Etcd:
        Hosts:
          - localhost:2379
        Key: auths.rpc
      NonBlock: true
    Mappings:
      - Method: post
        Path: /api/v1/auth/validate
        RpcPath: auths.Auths/ValidateToken
      - Method: post
        Path: /api/v1/auth/refresh
        RpcPath: auths.Auths/RenewToken

  - Grpc:
      Etcd:
        Hosts:
          - localhost:2379
        Key: search.rpc
      NonBlock: true
    Mappings:
      - Method: get
        Path: /api/v1/search
        RpcPath: search.SearchService/Search
      - Method: post
        Path: /api/v1/search/parse
        RpcPath: search.SearchService/ParseQuery

  - Grpc:
      Etcd:
        Hosts:
          - localhost:2379
        Key: admin.rpc
      NonBlock: true
    Mappings:
      - Method: get
        Path: /api/v1/admin/products
        RpcPath: admin.AdminProductService/ListProducts
