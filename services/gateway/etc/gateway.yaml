# Core services only (working ones)
# Checkout 暂时注释，因为 RPC 方法名可能不匹配
Name: gateway
Host: 0.0.0.0
Port: 8888

Log:
  Mode: 'console'
  Encoding: 'json'
  Stat: true

Auth:
  AccessSecret: "u666"
  AccessExpire: 86400

Upstreams:
  # Users 服务 - Port 10001
  - Grpc:
      NonBlock: true
      Target: users.go-mall.svc.cluster.local:10001
    Mappings:
      - Method: post
        Path: /douyin/user/login
        RpcPath: users.Users/Login
      - Method: post
        Path: /douyin/user/register
        RpcPath: users.Users/Register

  # Product 服务 - Port 10002
  - Grpc:
      NonBlock: true
      Target: product.go-mall.svc.cluster.local:10002
    Mappings:
      - Method: get
        Path: /douyin/product/list
        RpcPath: product.ProductCatalogService/ListProducts

  # System 服务 - Port 10010
  - Grpc:
      NonBlock: true
      Target: system.go-mall.svc.cluster.local:10010
    Mappings:
      - Method: get
        Path: /api/v1/system/time
        RpcPath: system.System/Time

  # Carts 服务 - Port 10003
  - Grpc:
      NonBlock: true
      Target: carts.go-mall.svc.cluster.local:10003
    Mappings:
      - Method: get
        Path: /douyin/cart/list
        RpcPath: Cart/CartItemList

  # Order 服务 - Port 10004
  - Grpc:
      NonBlock: true
      Target: order.go-mall.svc.cluster.local:10004
    Mappings:
      - Method: post
        Path: /douyin/order/create
        RpcPath: OrderService/CreateOrder
      - Method: get
        Path: /douyin/order/list
        RpcPath: OrderService/ListOrders

  # Payment 服务 - Port 10006
  - Grpc:
      NonBlock: true
      Target: payment.go-mall.svc.cluster.local:10006
    Mappings:
      - Method: post
        Path: /douyin/payment/create
        RpcPath: Payment/CreatePayment

  # Inventory 服务 - Port 10007
  - Grpc:
      NonBlock: true
      Target: inventory.go-mall.svc.cluster.local:10007
    Mappings:
      - Method: get
        Path: /douyin/inventory/detail
        RpcPath: Inventory/GetInventory

  # Activity 服务 - Port 10011
  - Grpc:
      NonBlock: true
      Target: activity.go-mall.svc.cluster.local:10011
    Mappings:
      - Method: get
        Path: /api/v1/activity/token
        RpcPath: Activity/Token

  # Auths 服务 - Port 10000
  - Grpc:
      NonBlock: true
      Target: auths.go-mall.svc.cluster.local:10000
    Mappings:
      - Method: post
        Path: /api/v1/auth/validate
        RpcPath: Auths/ValidateToken

  # Coupons 服务 - Port 10009
  - Grpc:
      NonBlock: true
      Target: coupons.go-mall.svc.cluster.local:10009
    Mappings:
      - Method: get
        Path: /douyin/coupon/list
        RpcPath: Coupons/ListCoupons

  # Admin 服务 - Port 10012
  - Grpc:
      NonBlock: true
      Target: admin.go-mall.svc.cluster.local:10012
    Mappings:
      - Method: get
        Path: /api/v1/admin/products
        RpcPath: Admin/GetProducts
      - Method: post
        Path: /api/v1/admin/products
        RpcPath: Admin/CreateProduct
      - Method: put
        Path: /api/v1/admin/products/:id
        RpcPath: Admin/UpdateProduct
      - Method: delete
        Path: /api/v1/admin/products/:id
        RpcPath: Admin/DeleteProduct

  # Checkout 服务 - Port 10005 (临时移除)
  # - Grpc:
  #     NonBlock: true
  #     Target: checkout.go-mall.svc.cluster.local:10005
  #   Mappings:
  #     - Method: post
  #       Path: /douyin/checkout/prepare
  #       RpcPath: CheckoutService/PrepareCheckout

  # Audit 服务 - Port 10008 (临时移除)
  # - Grpc:
  #     NonBlock: true
  #     Target: audit.go-mall.svc.cluster.local:10008
  #   Mappings:
  #     - Method: get
  #       Path: /api/v1/audit/logs
  #       RpcPath: Audit/ListLogs