Name: gateway
Host: 0.0.0.0
Port: 8888

Log:
  Mode: "console"
  Encoding: "json"
  Stat: false

Auth:
  AccessSecret: "u666"
  AccessExpire: 86400

Upstreams:
  - Grpc:
      Etcd:
        Hosts:
          - localhost:2379
        Key: users.rpc
      NonBlock: true
    Mappings:
      - Method: post
        Path: /douyin/user/login
        RpcPath: users.Users/Login
      - Method: post
        Path: /douyin/user/register
        RpcPath: users.Users/Register

  - Grpc:
      Etcd:
        Hosts:
          - localhost:2379
        Key: products.rpc
      NonBlock: true
    Mappings:
      - Method: get
        Path: /douyin/product/list
        RpcPath: product.ProductCatalogService/ListProducts

  - Grpc:
      Etcd:
        Hosts:
          - localhost:2379
        Key: carts.rpc
      NonBlock: true
    Mappings:
      - Method: get
        Path: /douyin/cart/list
        RpcPath: carts.Cart/CartItemList

  - Grpc:
      Etcd:
        Hosts:
          - localhost:2379
        Key: order.rpc
      NonBlock: true
    Mappings:
      - Method: post
        Path: /douyin/order/create
        RpcPath: order.OrderService/CreateOrder
      - Method: get
        Path: /douyin/order/list
        RpcPath: order.OrderService/ListOrders

  - Grpc:
      Etcd:
        Hosts:
          - localhost:2379
        Key: checkout.rpc
      NonBlock: true
    Mappings:
      - Method: post
        Path: /douyin/checkout/prepare
        RpcPath: checkout.CheckoutService/PrepareCheckout

  - Grpc:
      Etcd:
        Hosts:
          - localhost:2379
        Key: payment.rpc
      NonBlock: true
    Mappings:
      - Method: post
        Path: /douyin/payment/create
        RpcPath: payment.Payment/CreatePayment

  - Grpc:
      Etcd:
        Hosts:
          - localhost:2379
        Key: inventory.rpc
      NonBlock: true
    Mappings:
      - Method: get
        Path: /douyin/inventory/detail
        RpcPath: inventory.Inventory/GetInventory

  - Grpc:
      Etcd:
        Hosts:
          - localhost:2379
        Key: activity.rpc
      NonBlock: true
    Mappings:
      - Method: get
        Path: /api/v1/activity/token
        RpcPath: activity.Activity/Token

  - Grpc:
      Etcd:
        Hosts:
          - localhost:2379
        Key: system.rpc
      NonBlock: true
    Mappings:
      - Method: get
        Path: /api/v1/system/time
        RpcPath: system.System/Time

  - Grpc:
      Etcd:
        Hosts:
          - localhost:2379
        Key: auths.rpc
      NonBlock: true
    Mappings:
      - Method: post
        Path: /api/v1/auth/validate
        RpcPath: auths.Auths/ValidateToken

  - Grpc:
      Etcd:
        Hosts:
          - localhost:2379
        Key: coupons.rpc
      NonBlock: true
    Mappings:
      - Method: get
        Path: /douyin/coupon/list
        RpcPath: coupons.Coupons/ListCoupons

  - Grpc:
      Etcd:
        Hosts:
          - localhost:2379
        Key: admin.rpc
      NonBlock: true
    Mappings:
      - Method: get
        Path: /api/v1/admin/products
        RpcPath: admin.AdminProductService/ListProducts
