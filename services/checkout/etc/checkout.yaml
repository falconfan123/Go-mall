Name: checkout.rpc
ListenOn: 0.0.0.0:10005
Mode: dev
Timeout: 0
Etcd:
  Hosts:
    - localhost:2379
  Key: checkout.rpc

# 链路追踪
Telemetry:
  Name: checkout.rpc
  Endpoint: http://localhost:14268/api/traces
  Batcher: zipkin
  Sampler: 1.0

Log:
  ServiceName: "checkout-rpc"
  Mode: 'console'
  Encoding: "json"
  Stat: false

PostgresConfig:
  datasource: postgres://root:fht3825099@localhost:5432/mall?sslmode=disable
  conntimeout: 5

InventoryRpc:
  Etcd:
    Hosts:
      - localhost:2379
    Key: inventory.rpc
  NonBlock: true
  Timeout: 3000

ProductRpc:
  Etcd:
    Hosts:
      - localhost:2379
    Key: products.rpc
  NonBlock: true
  Timeout: 10000
CouponsRpc:
  Etcd:
    Hosts:
      - localhost:2379
    Key: coupons.rpc
  NonBlock: true
  Timeout: 10000
RedisConf:
  Host: localhost:6379
  Type: node
  Pass: ""
  Tls: false

RabbitMQConfig:
  Host: "localhost"
  Port: 5672
  User: "admin"
  Pass: "admin"
  VHost: "/"

# Prometheus 监控暴露
PrometheusExt:
  Host: 0.0.0.0
  Port: 9105
  Path: /metrics


