Name: checkout.rpc
ListenOn: 0.0.0.0:10005 # 端口见接口文档
Mode: pro
Timeout: 18000
# 服务发现
Etcd:
  Hosts:
    - ${ETCD_HOST}
  Key: checkout.rpc # 与服务名称保持一致

PostgresConfig:
  datasource: ${POSTGRES_DATA_SOURCE}
  conntimeout: 5

Log:
  ServiceName: "checkout-rpc"
  Mode: 'console'
  Encoding: "json"
  Stat: false

# 指标监控配置
DevServer:
  Enabled: true
  Host: 0.0.0.0
  Port: 11005 # 服务端口+1000，如果服务端口是10001，则指标端口就是11001
  EnablePprof: false

# 链路追踪
Telemetry:
  Name: checkout.rpc # 与服务名称保持一致
  Endpoint: ${TRACES_ENDPOINT}
  Batcher: zipkin
  Sampler: 0.1 # 采样率，1.0表示全部采集, 0.1表示10%

InventoryRpc:
  Etcd:
    Hosts:
      - ${ETCD_HOST}
    Key: inventory.rpc
  NonBlock: true
  Timeout: 3000

ProductRpc:
  Etcd:
    Hosts:
      - ${ETCD_HOST}
    Key: products.rpc
  NonBlock: true
  Timeout: 5000

CouponsRpc:
  Etcd:
    Hosts:
      - ${ETCD_HOST}
    Key: coupons.rpc
  NonBlock: true
  Timeout: 5000

RedisConf:
  Host: ${REDIS_HOST}
  Type: node
  Pass: ${REDIS_PASSWORD}
  Tls: false
