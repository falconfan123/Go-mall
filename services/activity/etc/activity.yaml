Name: activity.rpc
ListenOn: 0.0.0.0:10011
Mode: dev

# 服务发现
Etcd:
  Hosts:
    - localhost:2379
  Key: activity.rpc

# 日志配置
Log:
  ServiceName: "activity-rpc"
  Mode: 'console'
  Encoding: "json"
  Path: "./logs/activity-rpc"

# Redis 配置
RedisConf:
  Host: localhost:6379
  Pass: jjzzchtt
  Tls: false

# 活动配置
Activity:
  TokenExpire: 60 # token 有效期（秒）
  AdvanceSeconds: 5 # 提前获取 token 的秒数

DevServer:
  Enabled: true
  Host: 0.0.0.0
  Port: 11011
  EnablePprof: false

# 链路追踪
Telemetry:
  Name: activity.rpc
  Endpoint: http://localhost:9411/api/v2/spans
  Batcher: zipkin
  Sampler: 1.0
