Name: order.rpc
ListenOn: 0.0.0.0:10004
Mode: pro
Timeout: 28000
# 服务发现
Etcd:
  Hosts:
    - ${ETCD_HOST}
  Key: order.rpc


PostgresConfig:
  datasource: ${POSTGRES_DATA_SOURCE}

Log:
  ServiceName: "order-rpc"
  Mode: 'console'
  Encoding: "json"
  Stat: false

# 指标监控配置
DevServer:
  Enabled: true
  Host: 0.0.0.0
  Port: 11004
  EnablePprof: false

# 链路追踪
Telemetry:
  Name: order.rpc # 与服务名称保持一致
  Endpoint: ${TRACES_ENDPOINT}
  Batcher: zipkin
  Sampler: 0.1  # 采样率，1.0表示全部采集, 0.1表示10%


CheckoutRpc:
  Etcd:
    Hosts:
      - ${ETCD_HOST}
    Key: checkout.rpc
  NonBlock: true
  Timeout: 16000

CouponRpc:
  Etcd:
    Hosts:
      - ${ETCD_HOST}
    Key: coupons.rpc
  NonBlock: true
  Timeout: 4000
UserRpc:
  Etcd:
    Hosts:
      - ${ETCD_HOST}
    Key: users.rpc
  NonBlock: true
  Timeout: 3000
InventoryRpc:
  Etcd:
    Hosts:
      - ${ETCD_HOST}
    Key: inventory.rpc
  NonBlock: true
  Timeout: 3000

RabbitMQConfig:
  Host: ${RABBITMQ_HOST}
  Port: ${RABBITMQ_PORT}
  User: ${RABBITMQ_USERNAME}
  Pass: ${RABBITMQ_PASSWORD}
  VHost: ${RABBITMQ_VHOST}
