Name: order.rpc
ListenOn: 0.0.0.0:10004
Mode: dev
Timeout: 0
# 服务发现
Etcd:
  Hosts:
    - localhost:2379
  Key: order.rpc

# 链路追踪
Telemetry:
  Name: order.rpc
  Endpoint: http://localhost:14268/api/traces
  Batcher: zipkin
  Sampler: 1.0

Log:
  ServiceName: "order-rpc"
  Mode: 'console'
  Encoding: "json"
  Stat: false

PostgresConfig:
  datasource: postgres://root:fht3825099@localhost:5432/mall?sslmode=disable
  conntimeout: 5



CheckoutRpc:
  Etcd:
    Hosts:
      - localhost:2379
    Key: checkout.rpc
  NonBlock: true
  Timeout: 10000

CouponRpc:
  Etcd:
    Hosts:
      - localhost:2379
    Key: coupons.rpc
  NonBlock: true
  Timeout: 10000
UserRpc:
  Etcd:
    Hosts:
      - localhost:2379
    Key: users.rpc
  NonBlock: true
  Timeout: 10000
InventoryRpc:
  Etcd:
    Hosts:
      - localhost:2379
    Key: inventory.rpc
  NonBlock: true
  Timeout: 10000

RabbitMQConfig:
  Host: "localhost"
  Port: 5672
  User: "admin"
  Pass: "admin"
  VHost: "/"

RedisConf:
  Host: localhost:6379
  Type: node
  Pass: ""
  Tls: false

# Prometheus 监控暴露
PrometheusExt:
  Host: 0.0.0.0
  Port: 9104
  Path: /metrics
