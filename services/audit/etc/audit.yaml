Name: audit.rpc
ListenOn: 0.0.0.0:10008
Mode: dev
Timeout: 5000
# 服务发现
Etcd:
  Hosts:
    - localhost:2379
  Key: audit.rpc

# 链路追踪
Telemetry:
  Name: audit.rpc
  Endpoint: http://localhost:14268/api/traces
  Batcher: zipkin
  Sampler: 1.0
Log:
  ServiceName: "audit-rpc"
  Mode: 'console'
  Encoding: "json"
  Stat: false

PostgresConfig:
  datasource: postgres://root:fht3825099@localhost:5432/mall?sslmode=disable
  Conntimeout: 5

RedisConf:
  Host: localhost:6379
  Type: node
  Pass: ""
  Tls: false

RabbitMQ:
  Host: "localhost"
  Port: 5672
  User: "admin"
  Pass: "admin"
  VHost: "/"

ElasticSearch:
  Addr: "http://localhost:9200"
  IndexName: "audit_logs"

# Prometheus 监控暴露
PrometheusExt:
  Host: 0.0.0.0
  Port: 9108
  Path: /metrics

DevServer:
  Enabled: true
  Host: 0.0.0.0
  Port: 11008
  EnablePprof: false
