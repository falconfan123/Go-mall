Name: coupons.rpc
ListenOn: 0.0.0.0:10009


# 服务发现
Etcd:
  Hosts:
    - localhost:2379
  Key: coupons.rpc

# 链路追踪
Telemetry:
  Name: coupons.rpc
  Endpoint: http://localhost:14268/api/traces
  Batcher: zipkin
  Sampler: 1.0

Log:
  ServiceName: "coupons-rpc"
  Mode: 'console'
  Encoding: "json"
  Stat: false

PostgresConfig:
  datasource: postgres://root:fht3825099@localhost:5432/mall?sslmode=disable
  Conntimeout: 5


RedisConf:
  Host: localhost:6379
  Type: node
  Pass: "" # 如果有密码则填写
  Tls: false


ProductRpc:
  Etcd:
    Hosts:
      - localhost:2379
    Key: products.rpc
  NonBlock: true
  Timeout: 5000

# Prometheus 监控暴露
PrometheusExt:
  Host: 0.0.0.0
  Port: 9109
  Path: /metrics
