apiVersion: apps/v1
kind: Deployment
metadata:
  name: dtm
  namespace: go-mall
  labels:
    app: dtm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dtm
  template:
    metadata:
      labels:
        app: dtm
    spec:
      containers:
        - name: dtm
          image: yedf/dtm:1.19.0
          imagePullPolicy: IfNotPresent
          args:
            - "-c=/app/dtm/configs/config.yaml"
          volumeMounts:
            - mountPath: /app/dtm/configs
              name: config
          ports:
            - containerPort: 36789
              protocol: TCP
              name: http
            - containerPort: 36790
              protocol: TCP
              name: grpc
          livenessProbe:
            httpGet:
              path: /api/ping
              port: 36789
              scheme: HTTP
          readinessProbe:
            httpGet:
              path: /api/ping
              port: 36789
              scheme: HTTP
          resources:
            requests:
              cpu: 200m
              memory: 200Mi
      volumes:
        - name: config
          configMap:
            name: dtm-conf
---
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: go-mall
  name: dtm-conf
  labels:
    app: dtm
data:
  config.yaml: |-
    Store:
      Driver: 'postgres'          # 集群内 PostgreSQL（与业务库同实例风格，host 按集群实际调整）
      Host: 'postgres.go-mall'
      Port: 5432
      User: 'root'
      Password: 'fht3825099'
      Database: 'dtm'             # 须先创建；存储表由 dtm 启动时自动迁移
    TimeZoneOffset: 8             # 与 postgres 会话时区对齐（见 dev conf 同项注释）
    # MicroService 注册暂不启用（集群无 consul）；各服务配置直连地址 dtm-service.go-mall:36790
    # 如需服务发现：镜像已内置 dtmdriver-gozero，可配
    # MicroService: { Driver: 'dtm-driver-gozero', Target: 'etcd://<etcd>:2379/dtmservice', EndPoint: '0.0.0.0:36790' }

---
apiVersion: v1
kind: Service
metadata:
  name: dtm-service
  namespace: go-mall
spec:
  selector:
    app: dtm  # 匹配Deployment的标签
  ports:
    - name: http
      port: 36789           # 集群内访问的端口
      targetPort: 36789  # 映射到容器端口
      nodePort: 30789
      protocol: TCP
  type: NodePort