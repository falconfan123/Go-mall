name: Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rpc-integration:
    name: RPC Integration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GO_MALL_TEST_LOCAL: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache: false

      - name: Restore Go caches
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('.go-version', 'go.sum', 'go.work.sum', '**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Sync workspace
        run: go work sync

      - name: Run RPC integration tests
        run: make test-integration

      - name: Upload integration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpc-integration-report
          if-no-files-found: ignore
          path: .artifacts/rpc-integration-report/*

      - name: Upload service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpc-service-logs
          if-no-files-found: ignore
          path: scripts/logs/*.log
          retention-days: 7

      - name: Collect diagnostics on failure
        if: failure()
        run: |
          mkdir -p diagnostics
          docker ps -a > diagnostics/docker-ps.txt 2>&1 || true
          ss -ltnp > diagnostics/listening-ports.txt 2>&1 || true
          cp -r scripts/logs diagnostics/service-logs 2>/dev/null || true
          cp -r .artifacts/dependency-logs diagnostics/dependency-logs 2>/dev/null || true
          for c in etcd rabbitmq elasticsearch postgres redis gorse; do
            docker inspect --format '{{.Name}} status={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}n/a{{end}}' go-mall-$c > diagnostics/dep-$c-health.txt 2>&1 || true
          done

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-diagnostics
          path: diagnostics/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload dependency logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpc-dependency-logs
          if-no-files-found: ignore
          path: .artifacts/dependency-logs/*.log

  integration-summary:
    name: Integration
    if: ${{ always() }}
    needs:
      - rpc-integration
    runs-on: ubuntu-latest
    steps:
      - name: Check integration result
        run: |
          if [[ "${{ needs.rpc-integration.result }}" != "success" ]]; then
            echo "integration workflow failed"
            exit 1
          fi
