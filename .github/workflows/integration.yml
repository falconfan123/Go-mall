name: Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rpc-integration:
    name: RPC Integration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GO_MALL_TEST_LOCAL: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache: false

      - name: Restore Go caches
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('.go-version', 'go.sum', 'go.work.sum', '**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Sync workspace
        run: go work sync

      - name: Run RPC integration tests
        run: make test-integration

      - name: Upload integration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpc-integration-report
          if-no-files-found: ignore
          path: .artifacts/rpc-integration-report/*

      - name: Upload service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpc-service-logs
          if-no-files-found: ignore
          path: scripts/logs/*.log

      - name: Upload dependency logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpc-dependency-logs
          if-no-files-found: ignore
          path: .artifacts/dependency-logs/*.log

  integration-summary:
    name: Integration
    if: ${{ always() }}
    needs:
      - rpc-integration
    runs-on: ubuntu-latest
    steps:
      - name: Check integration result
        run: |
          if [[ "${{ needs.rpc-integration.result }}" != "success" ]]; then
            echo "integration workflow failed"
            exit 1
          fi
